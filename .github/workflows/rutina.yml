name: Rutina diaria de etapas

on:
  # Horas en UTC (España: +2 en verano, +1 en invierno). GitHub no garantiza las ejecuciones
  # programadas y en las horas en punto se saturan, así que se usa un minuto "raro" y dos respaldos
  # que solo trabajan si ese día todavía no se ha ejecutado la rutina.
  schedule:
    - cron: "7 6 * * *"        # principal: 08:07 en España (verano)
    - cron: "37 7 * * *"       # respaldo
    - cron: "7 10 * * *"       # respaldo
  workflow_dispatch:            # botón "Run workflow" para lanzarla a mano
    inputs:
      aviso_prueba:
        description: "Enviar un aviso de prueba por correo"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["watchlist.txt", "etapas/**"]   # al cambiar la lista o el código, se actualiza

permissions:
  contents: write               # guardar el historial en el repositorio
  pages: write                  # publicar la web
  issues: write                 # avisos: una issue por día con novedades (GitHub la envía por correo)
  id-token: write

concurrency:
  group: rutina
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      hecho: ${{ steps.hoy.outputs.hecho }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: out/historial
      - id: hoy
        name: ¿Se ha ejecutado ya hoy?
        run: |
          if [ -f "out/historial/$(date -u +%F).json" ]; then
            echo "hecho=1" >> "$GITHUB_OUTPUT"; echo "Ya hay historial de hoy."
          fi

  rutina:
    needs: comprobar
    # Las programadas de respaldo no hacen nada si hoy ya se ejecutó
    if: github.event_name != 'schedule' || needs.comprobar.outputs.hecho != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # siempre la última versión (también al reejecutar una ejecución antigua)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Ejecutar la rutina
        env:
          ETAPAS_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ETAPAS_AVISO_PRUEBA: ${{ inputs.aviso_prueba && '1' || '' }}
        run: python -m etapas --rutina

      - name: Aviso por correo si hay novedades (solo la primera ejecución del día)
        if: hashFiles('out/alertas.md') != '' && (needs.comprobar.outputs.hecho != '1' || inputs.aviso_prueba)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "$(cat out/alertas_titulo.txt)" \
            --body-file out/alertas.md \
            --assignee "${{ github.repository_owner }}"

      - name: Guardar el historial (para detectar cambios mañana)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/historial out/rutina.log
          if ! git diff --cached --quiet; then
            git commit -m "Historial $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deploy
        uses: actions/deploy-pages@v4
