name: Aviso de factor de salud en Aave

# Respaldo de la tarea de Windows (cada 15 minutos con el PC encendido): funciona con el PC apagado.
# GitHub no garantiza la hora de las ejecuciones programadas y las retrasa a veces mucho, así que es
# un respaldo, no la vigilancia principal. Las direcciones van en la variable AAVE_CARTERAS del
# repositorio (Settings → Secrets and variables → Actions → Variables), separadas por comas.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write                 # el aviso es una issue (GitHub la envía por correo y al móvil)

concurrency:
  group: aave-aviso
  cancel-in-progress: false

jobs:
  aviso:
    if: vars.AAVE_CARTERAS != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar el factor de salud
        env:
          GH_TOKEN: ${{ github.token }}
          AAVE_CARTERAS: ${{ vars.AAVE_CARTERAS }}
        run: python -m etapas.aave_aviso
