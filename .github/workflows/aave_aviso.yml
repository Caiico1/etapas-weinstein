name: Aviso de factor de salud en Aave

# Respaldo diario de la tarea de Windows (cada 15 minutos con el PC encendido): funciona con el PC apagado.
# GitHub no garantiza la hora de las ejecuciones programadas y las retrasa a veces mucho, así que es
# un respaldo, no la vigilancia principal. Las direcciones van en el secret AAVE_CARTERAS del
# repositorio (Settings → Secrets and variables → Actions → Secrets), separadas por comas. Secret y no
# variable: el log de un repositorio público muestra el valor de las variables, no el de los secrets.
on:
  schedule:
    - cron: "23 4 * * *"        # una vez al día (con el retraso de GitHub, por la mañana en España)
  workflow_dispatch:

permissions:
  contents: read
  issues: write                 # el aviso es una issue (GitHub la envía por correo y al móvil)

concurrency:
  group: aave-aviso
  cancel-in-progress: false

jobs:
  aviso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar el factor de salud
        env:
          GH_TOKEN: ${{ github.token }}
          AAVE_CARTERAS: ${{ secrets.AAVE_CARTERAS }}
        run: |
          if [ -z "$AAVE_CARTERAS" ]; then echo "Sin el secret AAVE_CARTERAS: no hay nada que vigilar."; exit 0; fi
          python -m etapas.aave_aviso
