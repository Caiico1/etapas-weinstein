[project]
name = "etapas"
version = "0.1.0"
description = "Detector de etapas de mercado (Weinstein) para criptoactivos"
requires-python = ">=3.10"
dependencies = ["ccxt>=4.0", "pandas>=2.0", "numpy>=1.24", "plotly>=5.0"]

[project.scripts]
etapas = "etapas.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etapas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
